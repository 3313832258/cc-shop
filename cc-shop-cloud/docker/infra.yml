# CC-Shop 基础设施中间件一键启动
# 用法: docker compose -f docker/infra.yml up -d
#
# 生产环境部署前必须修改以下密码（通过环境变量或 .env 文件）：
#   MYSQL_ROOT_PASSWORD, MYSQL_APP_PASSWORD
#   REDIS_PASSWORD
#   RABBITMQ_PASSWORD
#   NACOS_DB_PASSWORD
#   JWT_SECRET
#
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: cc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_root_password}
      MYSQL_DATABASE: cc_shop
      MYSQL_USER: ${MYSQL_APP_USER:-ccshop}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-your_password}
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --init-connect='SET NAMES utf8mb4;'
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf:/etc/mysql/conf.d

  redis:
    image: redis:7
    container_name: cc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-your_password}
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cc-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ccshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-your_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cc-nacos
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: ${MYSQL_APP_USER:-ccshop}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:-your_password}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      JVM_XMS: "512m"
      JVM_XMX: "512m"
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data

  # Seata 需要自己的存储库(默认 file 模式即可用于简历项目演示)
  seata:
    image: seataio/seata-server:1.7.0
    container_name: cc-seata
    restart: unless-stopped
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
      SEATA_IP: 127.0.0.1
    ports:
      - "8091:8091"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
