server:
  port: 8080

spring:
  codec:
    default-charset: utf-8
  application:
    name: cc-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
    gateway:
      routes:
        # 用户服务
        - id: cc-user
          uri: lb://cc-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # 商品服务
        - id: cc-product
          uri: lb://cc-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

        # 交易服务（购物车/订单/支付/物流）
        - id: cc-trade
          uri: lb://cc-trade
          predicates:
            - Path=/api/trade/**
          filters:
            - StripPrefix=1

        # 促销服务（优惠券/秒杀）
        - id: cc-promotion
          uri: lb://cc-promotion
          predicates:
            - Path=/api/promotion/**
          filters:
            - StripPrefix=1

        # 管理后台
        - id: cc-admin
          uri: lb://cc-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        # AI 智能客服
        - id: cc-ai
          uri: lb://cc-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

# Sentinel 规则（内存模式，生产环境应持久化到 Nacos）
spring.cloud.sentinel.gateway.api-group:
  - name: user-api
    rules:
      - resource: /api/user/**
        count: 100
        grade: 1  # QPS
        limitApp: default
      # 登录接口限流：5次/分钟/IP
      - resource: /api/user/auth/login
        count: 5
        grade: 1
        intervalSec: 60
        limitApp: default
      # 注册接口限流：3次/分钟/IP
      - resource: /api/user/auth/register
        count: 3
        grade: 1
        intervalSec: 60
        limitApp: default
  - name: product-api
    rules:
      - resource: /api/product/**
        count: 200
        grade: 1
        limitApp: default
  - name: trade-api
    rules:
      - resource: /api/trade/**
        count: 100
        grade: 1
        limitApp: default
      # 下单接口限流：10次/分钟/用户
      - resource: /api/trade/order/place
        count: 10
        grade: 1
        intervalSec: 60
        limitApp: default
      # 支付接口限流：5次/分钟/用户
      - resource: /api/trade/payment/pay
        count: 5
        grade: 1
        intervalSec: 60
        limitApp: default
  - name: promotion-api
    rules:
      - resource: /api/promotion/**
        count: 100
        grade: 1
        limitApp: default
      # 秒杀接口限流：100次/秒（热点商品）
      - resource: /api/promotion/flash/sale
        count: 100
        grade: 1
        limitApp: default
  - name: admin-api
    rules:
      - resource: /api/admin/**
        count: 100
        grade: 1
        limitApp: default
  - name: ai-api
    rules:
      - resource: /api/ai/**
        count: 20
        grade: 1
        limitApp: default

logging:
  level:
    root: INFO
    com.ccshop.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
