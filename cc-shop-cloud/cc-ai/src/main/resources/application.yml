server:
  port: 8087

spring:
  application:
    name: cc-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        import-check:
          enabled: false

# 通义千问 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  model: qwen-turbo
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

logging:
  level:
    root: INFO
    com.ccshop.ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
