# CC-Shop CI/CD Pipeline
# 触发条件：push 到 main 分支或 PR

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ==================== 后端构建 ====================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: cc-shop-cloud
        run: mvn clean package -DskipTests -B

      - name: Run tests
        working-directory: cc-shop-cloud
        run: mvn test -B

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: cc-shop-cloud/*/target/*.jar
          retention-days: 7

  # ==================== 前端用户端构建 ====================
  frontend-web-build:
    name: Frontend Web Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cc-shop-web/package-lock.json

      - name: Install dependencies
        working-directory: cc-shop-web
        run: npm ci

      - name: Run tests
        working-directory: cc-shop-web
        run: npm test

      - name: Build
        working-directory: cc-shop-web
        run: npm run build

      - name: Upload frontend web artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: cc-shop-web/.output
          retention-days: 7

  # ==================== 管理后台构建 ====================
  frontend-admin-build:
    name: Frontend Admin Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cc-shop-admin/package-lock.json

      - name: Install dependencies
        working-directory: cc-shop-admin
        run: npm ci

      - name: Build
        working-directory: cc-shop-admin
        run: npm run build

      - name: Upload frontend admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin
          path: cc-shop-admin/.output
          retention-days: 7

  # ==================== Docker 构建（仅 main 分支） ====================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-web-build, frontend-admin-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: cc-shop-cloud

      - name: Download frontend web artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: cc-shop-web/.output

      - name: Download frontend admin artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-admin
          path: cc-shop-admin/.output

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build

      - name: Verify Docker images
        run: |
          docker images | grep cc-shop